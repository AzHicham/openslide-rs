name: Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    env:
      DOCKER_IMAGE: openslide-rs-slide-info
      DOCKER_TAG_PRIMARY: ${{ github.sha }}
      DOCKER_PLATFORMS: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/bake-action@v7
        with:
          files: dockerfiles/docker-bake.hcl
          targets: slide-info
          set: |
            *.cache-from=type=gha,scope=slide-info
            *.cache-to=type=gha,mode=max,scope=slide-info
